name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradle
      run: chmod +x gradlew || true

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper not found, generating..."
          gradle wrapper --gradle-version 9.3.1
        else
          echo "Gradle wrapper already exists"
        fi

    - name: Grant execute permission for generated gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias androiddebugkey -keypass android -storepass android \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build information
      run: |
        echo "Build completed successfully!"
        echo "APK location: app/build/outputs/apk/debug/app-debug.apk"
        ls -lh app/build/outputs/apk/debug/ || echo "Directory not found"
